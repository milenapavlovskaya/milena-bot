name: keep-alive

# Каждые 5 минут заходит на адрес бота, чтобы бесплатный сервер Render не засыпал
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping bot
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://milena-bot-vgul.onrender.com/health
